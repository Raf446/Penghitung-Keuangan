<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Catatan Uang</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111827;--mut:#6b7280;--in:#16a34a;--out:#dc2626;--pri:#111827;--line:#eceef2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:110px}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.hero{background:var(--pri);color:#fff;border-radius:20px;padding:20px}
.hero small{opacity:.7}.hero h1{margin:4px 0 16px;font-size:32px}
.row{display:flex;gap:12px}.row>div{flex:1}
.in{color:#4ade80}.out{color:#f87171}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.day{font-size:13px;color:var(--mut);margin:16px 4px 6px;display:flex;justify-content:space-between}
.item{background:var(--card);padding:12px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.item:first-of-type{border-radius:14px 14px 0 0}.item:last-child{border:0;border-radius:0 0 14px 14px}
.item:only-child{border-radius:14px}
.ico{font-size:22px;width:40px;height:40px;background:var(--bg);border-radius:12px;display:grid;place-items:center}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-weight:600}
.item .m span{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pos{color:var(--in)}.neg{color:var(--out)}.amt{font-weight:600}
.empty{text-align:center;color:var(--mut);padding:48px 0}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:34px;box-shadow:0 6px 18px #0004}
.scrim{position:fixed;inset:0;background:#0006;display:none;z-index:5}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:.25s;max-width:480px;margin:0 auto}
.open .scrim{display:block}.open .sheet{transform:none}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-size:15px;font-weight:600;color:var(--mut)}
.seg button.on.out{background:var(--out);color:#fff}.seg button.on.in{background:var(--in);color:#fff}
#amt{width:100%;border:0;font-size:40px;font-weight:700;text-align:center;outline:0;padding:8px 0;background:none;color:var(--tx)}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 12px}
.f{display:flex;gap:8px;margin-bottom:12px}
.f input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;background:var(--bg);color:var(--tx)}
.save{width:100%;border:0;background:var(--pri);color:#fff;padding:16px;border-radius:14px;font-size:17px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <small>Total Saldo</small><h1 id="bal">Rp0</h1>
    <div class="row">
      <div><small>Pemasukan bulan ini</small><div class="in" id="inc">Rp0</div></div>
      <div><small>Pengeluaran bulan ini</small><div class="out" id="exp">Rp0</div></div>
    </div>
  </div>
  <div class="chips" id="filters"></div>
  <div id="list"></div>
</div>
<button class="fab" id="fab" aria-label="Tambah">+</button>

<div id="root">
  <div class="scrim" id="scrim"></div>
  <form class="sheet" id="form" autocomplete="off">
    <div class="seg">
      <button type="button" data-t="expense" class="on out">Pengeluaran</button>
      <button type="button" data-t="income">Pemasukan</button>
    </div>
    <input id="amt" inputmode="numeric" placeholder="0" required>
    <div class="cats" id="cats"></div>
    <div class="f">
      <input type="date" id="date">
      <input id="note" placeholder="Catatan (opsional)" maxlength="80">
    </div>
    <button class="save">Simpan</button>
  </form>
</div>

<script>
// ---------- Data ----------
const CATEGORIES=[
  {id:'food',name:'Makan',icon:'🍜'},{id:'transport',name:'Transport',icon:'🚌'},
  {id:'shopping',name:'Belanja',icon:'🛍️'},{id:'bills',name:'Tagihan',icon:'🧾'},
  {id:'other',name:'Lainnya',icon:'📦'}];
const KEY='txs_v1';
let txs=JSON.parse(localStorage.getItem(KEY)||'[]');
const save=()=>localStorage.setItem(KEY,JSON.stringify(txs));
const cat=id=>CATEGORIES.find(c=>c.id===id)||CATEGORIES[4];
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(n).toLocaleString('id-ID');
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const $=id=>document.getElementById(id);

// ---------- State ----------
let filter='all', type='expense', selCat='food';

// ---------- Render ----------
function render(){
  const ym=today().slice(0,7);
  let inc=0,exp=0,bal=0;
  txs.forEach(t=>{const s=t.type==='income'?t.amount:-t.amount;bal+=s;
    if(t.date.startsWith(ym)){t.type==='income'?inc+=t.amount:exp+=t.amount}});
  $('bal').textContent=rp(bal);$('inc').textContent=rp(inc);$('exp').textContent=rp(exp);

  $('filters').innerHTML=[{id:'all',name:'Semua',icon:''},...CATEGORIES]
    .map(c=>`<div class="chip ${filter===c.id?'on':''}" data-f="${c.id}">${c.icon} ${c.name}</div>`).join('');

  const rows=txs.filter(t=>filter==='all'||t.categoryId===filter)
    .sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  if(!rows.length){$('list').innerHTML='<div class="empty">Belum ada transaksi.<br>Tekan + untuk menambah.</div>';return}
  const groups={};rows.forEach(t=>(groups[t.date]??=[]).push(t));
  $('list').innerHTML=Object.entries(groups).map(([d,items])=>{
    const sum=items.reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);
    const label=new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    return `<div class="day"><span>${label}</span><span>${rp(sum)}</span></div><div>`+
      items.map(t=>{const c=cat(t.categoryId),p=t.type==='income';
        return `<div class="item" data-id="${t.id}"><div class="ico">${c.icon}</div>
        <div class="m"><b>${c.name}</b><span>${esc(t.note||'')}</span></div>
        <div class="amt ${p?'pos':'neg'}">${p?'+':'-'}${rp(t.amount)}</div></div>`}).join('')+'</div>';
  }).join('');
}
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function renderCats(){
  $('cats').innerHTML=CATEGORIES.map(c=>
    `<div class="chip ${selCat===c.id?'on':''}" data-c="${c.id}">${c.icon} ${c.name}</div>`).join('');
}

// ---------- Sheet ----------
function openSheet(){
  $('date').value=today();$('amt').value='';$('note').value='';
  renderCats();document.body.classList.add('open');
  setTimeout(()=>$('amt').focus(),250);
}
const closeSheet=()=>document.body.classList.remove('open');

// ---------- Events ----------
$('fab').onclick=openSheet;
$('scrim').onclick=closeSheet;
$('amt').oninput=e=>{const v=e.target.value.replace(/\D/g,'');e.target.value=v?(+v).toLocaleString('id-ID'):''};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  type=b.dataset.t;
  document.querySelectorAll('.seg button').forEach(x=>x.className=x===b?'on '+(type==='income'?'in':'out'):'');
});
$('cats').onclick=e=>{const c=e.target.closest('[data-c]');if(c){selCat=c.dataset.c;renderCats()}};
$('filters').onclick=e=>{const c=e.target.closest('[data-f]');if(c){filter=c.dataset.f;render()}};
$('form').onsubmit=e=>{
  e.preventDefault();
  const amount=parseInt($('amt').value.replace(/\D/g,''),10);
  if(!amount)return;
  txs.push({id:crypto.randomUUID(),type,amount,categoryId:selCat,
    date:$('date').value||today(),note:$('note').value.trim(),createdAt:Date.now()});
  save();closeSheet();render();
};
$('list').onclick=e=>{
  const it=e.target.closest('[data-id]');
  if(it&&confirm('Hapus transaksi ini?')){txs=txs.filter(t=>t.id!==it.dataset.id);save();render()}
};

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
